name: Test

on:
  - push
  - pull_request

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.tox-environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        tox-environment:
          - django42
          - django51
          - django52
        exclude:
          # Django 4.2 does not support Python 3.13
          - python-version: "3.13"
            tox-environment: django42

    env:
      TOXENV: ${{ matrix.tox-environment }}
      COVERALLS_FLAG_NAME: Python ${{ matrix.python-version }} / ${{ matrix.tox-environment }}
      COVERALLS_PARALLEL: true
      COVERALLS_SERVICE_NAME: github
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Run tests
        run: tox

      - name: Upload coverage data to coveralls.io
        run: |
          uv pip install --system coveralls
          coveralls

  coveralls:
    name: Indicate completion to coveralls.io
    runs-on: ubuntu-latest

    needs: test
    # Push coverage report even if test cases failed
    if: ${{ always() }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Report coverage to coveralls.io
        run: |
          uv pip install --system coveralls
          coveralls --finish
